name = "rancho-trailers-costeo"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Static site (index.html + the read-only Excel-origin JSON catalogs) served
# straight from the repo root. .assetsignore (at the repo root) keeps this
# worker/ directory itself out of the served files.
[assets]
directory = "../"
binding = "ASSETS"
# Default (no not_found_handling): a request that matches no static file
# falls through to this worker's fetch handler, which is required for
# /api/* and /files/* to ever be reached.

[[d1_databases]]
binding = "DB"
database_name = "rancho-trailers-costeo-db"
database_id = "29d3005c-d953-4d62-ad12-5bac5ba7ca85"

[[r2_buckets]]
binding = "COMPROBANTES"
bucket_name = "rancho-trailers-comprobantes"

# Set with: wrangler secret put MASTER_PASSWORD
# (never commit the actual value)

# Tipo de cambio FIX de Banxico (serie SF43718). Banxico lo publica en días
# hábiles alrededor de las 12:00 (CDMX); se consulta dos veces por si acaso.
# Requiere: wrangler secret put BANXICO_TOKEN
# (token gratuito en https://www.banxico.org.mx/SieAPIRest/service/v1/token)
[triggers]
crons = ["30 18 * * 1-5", "30 23 * * 1-5"]
